name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test # only build if tests passed
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t studentmgmt:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --name smoke -p 5000:5000 studentmgmt:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then echo; exit 0; fi
            sleep 2
          done
          echo "Health check failed. Container logs:"
          docker logs smoke
          exit 1
