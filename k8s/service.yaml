apiVersion: v1
kind: Service
metadata:
  name: student-management
  labels:
    app: student-management
spec:
  type: NodePort
  selector:
    app: student-management
  ports:
    - name: http
      port: 80          # port other Pods use: http://student-management
      targetPort: http  # container port 5000 (named "http" in the Deployment)
      nodePort: 30080   # port opened on the Minikube node
